---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      <a href="{{ '/' | relative_url }}">{{ site.author }}</a><br>
      {{ page.date | date: "%B %Y" }}
    </p>
    <p class="post-tags">{% include tags.html tags=page.tags %}</p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="post-contact">
    Questions or thoughts about this post? I'd love to hear them:
    <span class="email">firstname [dot] lastname [at] gmail [dot] com</span>
  </p>
</article>
